name: Push Trigger Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Success Message
        run: echo "Code pushed successfully!"

      - name: Display Date and Time
        run: date

      - name: Display Working Directory
        run: pwd
